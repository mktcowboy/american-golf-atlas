<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<title>American Golf Atlas</title>
<meta name="description" content="Interactive map of notable U.S. golf courses — state and regional leaderboards cross-referenced with national Top 100 lists."/>
<meta property="og:title" content="American Golf Atlas"/>
<meta property="og:description" content="Interactive map of notable U.S. golf courses — state and regional leaderboards cross-referenced with national Top 100 lists."/>
<meta property="og:type" content="website"/>
<meta property="og:url" content="https://mktcowboy.github.io/american-golf-atlas/"/>
<meta name="twitter:card" content="summary"/>
<meta name="twitter:title" content="American Golf Atlas"/>
<meta name="twitter:description" content="Interactive map of notable U.S. golf courses — state and regional leaderboards cross-referenced with national Top 100 lists."/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<style>
:root {
  --bg: #0b1210;
  --panel: rgba(12, 20, 17, 0.82);
  --panel-border: rgba(232, 213, 160, 0.22);
  --cream: #f6f1e4;
  --muted: rgba(246,241,228,0.62);
  --gold: #e6c36a;
  --gold-deep: #b8892d;
  --sage: #3d7a58;
  --sage-bright: #5ea87a;
  --danger: #c45c4a;
  --shadow: 0 18px 50px rgba(0,0,0,.45);
  --radius: 18px;
}
* { box-sizing: border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--cream);
  font-family:"Instrument Sans", system-ui, sans-serif; }
#map { position:absolute; inset:0; background:#1a2420; }

/* Soft vignette over map for polish */
.vignette {
  pointer-events:none; position:absolute; inset:0; z-index:450;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.35) 100%);
}

.ui { position:absolute; z-index:1000; pointer-events:none; }
.ui > * { pointer-events:auto; }

.top-left { top:18px; left:18px; display:flex; flex-direction:column; gap:10px; max-width:min(420px, calc(100vw - 36px)); }
.top-right { top:18px; right:18px; display:flex; flex-direction:column; gap:10px; align-items:flex-end; }
.bottom-left { bottom:24px; left:18px; }
.bottom-right { bottom:24px; right:18px; text-align:right; max-width:240px; }

.card {
  background: var(--panel);
  backdrop-filter: blur(16px) saturate(1.2);
  -webkit-backdrop-filter: blur(16px) saturate(1.2);
  border: 1px solid var(--panel-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px 18px;
}
.brand h1 {
  margin:0; font-family:"Instrument Serif", Georgia, serif;
  font-size:28px; font-weight:400; letter-spacing:-0.02em; line-height:1.1;
}
.brand h1 span { color: var(--gold); font-style: italic; }
.brand p { margin:8px 0 0; font-size:12.5px; color:var(--muted); line-height:1.4; }

.stat-row { display:flex; gap:16px; flex-wrap:wrap; }
.stat { min-width:64px; }
.stat b { display:block; font-size:20px; color:var(--gold); font-weight:600; letter-spacing:-0.02em; }
.stat span { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; }

.filters { display:grid; grid-template-columns: 1.4fr 0.8fr 1fr 0.8fr; gap:8px; }
@media (max-width: 900px) { .filters { grid-template-columns: 1fr 1fr; } }
.filters label { display:flex; flex-direction:column; gap:5px; font-size:10px; text-transform:uppercase; letter-spacing:0.07em; color:var(--muted); }
.filters input, .filters select {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(246,241,228,0.14);
  color: var(--cream);
  border-radius: 10px;
  padding: 9px 11px;
  font-size: 13px;
  font-family: inherit;
  outline: none;
}
.filters input:focus, .filters select:focus { border-color: var(--gold); }
.filters select option { background:#15201b; }

.chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.chip {
  border: 1px solid rgba(246,241,228,0.16);
  background: transparent;
  color: var(--cream);
  border-radius: 999px;
  padding: 6px 11px;
  font-size: 12px;
  cursor: pointer;
  transition: .15s ease;
}
.chip:hover { border-color: rgba(230,195,106,0.5); }
.chip.active { background: var(--sage); border-color: var(--sage-bright); }
.chip.star.active { background: linear-gradient(135deg, #8a6a12, #c49a46); border-color: var(--gold); color:#fff8e6; }
.chip.regional.active { background: #1e4d6b; border-color: #3b82a0; color:#e8f4fc; }

.basemap {
  display:flex; gap:6px; background:var(--panel); border:1px solid var(--panel-border);
  border-radius:999px; padding:4px; box-shadow:var(--shadow);
}
.basemap button {
  border:0; background:transparent; color:var(--muted); border-radius:999px;
  padding:8px 12px; font-size:12px; cursor:pointer; font-family:inherit;
}
.basemap button.active { background:rgba(230,195,106,0.18); color:var(--gold); }

.legend {
  font-size:12px; min-width:180px;
}
.legend .title { font-family:"Instrument Serif", serif; font-size:16px; margin:0 0 8px; }
.legend-row { display:flex; align-items:center; gap:8px; margin:5px 0; color:var(--muted); }
.dot { width:11px; height:11px; border-radius:50%; border:1.5px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,.25); }
.star-ico { color:var(--gold); font-size:15px; width:14px; text-align:center; filter: drop-shadow(0 1px 2px #000); }

.footnote { font-size:10px; color:var(--muted); line-height:1.35; text-shadow:0 1px 2px #000; }

.leaflet-control-zoom { border:none !important; box-shadow: var(--shadow) !important; margin-top: 70px !important; }
.leaflet-control-zoom a {
  background: var(--panel) !important; color: var(--cream) !important;
  border: 1px solid var(--panel-border) !important; width:34px !important; height:34px !important;
  line-height:34px !important; backdrop-filter: blur(12px);
}
.leaflet-popup-content-wrapper {
  background: #101a16; color: var(--cream); border-radius: 16px;
  border: 1px solid var(--panel-border); box-shadow: var(--shadow);
  padding: 4px;
}
.leaflet-popup-tip { background:#101a16; }
.leaflet-popup-content { margin: 12px 14px; min-width: 220px; }
.popup .kicker { font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--gold); margin-bottom:4px; }
.popup h3 { margin:0 0 6px; font-family:"Instrument Serif", serif; font-size:20px; font-weight:400; line-height:1.15; }
.popup .meta { font-size:12.5px; color:var(--muted); line-height:1.45; }
.popup .badges { margin-top:10px; display:flex; flex-wrap:wrap; gap:5px; }
.badge {
  font-size:10px; padding:3px 8px; border-radius:999px;
  background: rgba(61,122,88,0.35); border:1px solid rgba(94,168,122,0.35);
}
.badge.gold { background: rgba(184,137,45,0.28); border-color: rgba(230,195,106,0.45); color:#f3dfad; }
.popup a { color: var(--gold); text-decoration:none; font-size:12px; }
.popup a:hover { text-decoration:underline; }
.popup .links { margin-top:10px; display:flex; gap:10px; }

.marker-cluster-small { background: rgba(61,122,88,.35) !important; }
.marker-cluster-small div { background: rgba(61,122,88,.9) !important; color:#fff !important; }
.marker-cluster-medium { background: rgba(230,195,106,.3) !important; }
.marker-cluster-medium div { background: rgba(184,137,45,.92) !important; color:#1a1408 !important; }
.marker-cluster-large { background: rgba(196,92,74,.3) !important; }
.marker-cluster-large div { background: rgba(196,92,74,.9) !important; color:#fff !important; }
.marker-cluster div {
  font-family: "Instrument Sans", sans-serif !important;
  font-weight: 600 !important;
}

.table-panel {
  position: absolute; z-index: 1000; top: 18px; right: 18px; bottom: 24px;
  width: min(520px, calc(100vw - 36px));
  display: none; flex-direction: column;
  background: var(--panel);
  backdrop-filter: blur(16px) saturate(1.2);
  -webkit-backdrop-filter: blur(16px) saturate(1.2);
  border: 1px solid var(--panel-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
  pointer-events: auto;
}
.table-panel.open { display: flex; }
.table-panel .th {
  padding: 14px 16px 10px; border-bottom: 1px solid rgba(246,241,228,0.1);
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
}
.table-panel .th h2 {
  margin: 0; font-family: "Instrument Serif", Georgia, serif;
  font-size: 22px; font-weight: 400; letter-spacing: -0.02em;
}
.table-panel .th .sub { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
.table-panel .th-actions { display: flex; gap: 6px; flex-shrink: 0; }
.table-panel .icon-btn {
  border: 1px solid rgba(246,241,228,0.16); background: transparent; color: var(--cream);
  border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer; font-family: inherit;
}
.table-panel .icon-btn:hover { border-color: var(--gold); color: var(--gold); }
.table-scroll { overflow: auto; flex: 1; }
.table-panel table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.table-panel thead th {
  position: sticky; top: 0; background: rgba(16,26,22,0.96);
  text-align: left; padding: 8px 10px; font-size: 10px; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--muted); border-bottom: 1px solid rgba(246,241,228,0.12);
  z-index: 1;
}
.table-panel tbody td {
  padding: 9px 10px; border-bottom: 1px solid rgba(246,241,228,0.06);
  vertical-align: top; color: var(--cream);
}
.table-panel tbody tr { cursor: pointer; transition: background .12s ease; }
.table-panel tbody tr:hover { background: rgba(230,195,106,0.08); }
.table-panel .rank { color: var(--gold); font-weight: 600; width: 36px; }
.table-panel .name { font-weight: 500; line-height: 1.25; }
.table-panel .muted { color: var(--muted); font-size: 11.5px; }
.table-panel a { color: var(--gold); text-decoration: none; }
.table-panel a:hover { text-decoration: underline; }
.table-panel .pill {
  display: inline-block; font-size: 9px; padding: 2px 6px; border-radius: 999px;
  background: rgba(61,122,88,0.3); border: 1px solid rgba(94,168,122,0.3); margin: 1px 2px 1px 0;
}
.table-panel .pill.gold { background: rgba(184,137,45,0.25); border-color: rgba(230,195,106,0.4); color: #f3dfad; }
.ui.top-right { right: 18px; }
body.table-open .ui.top-right { right: min(548px, calc(100vw - 18px)); }
body.table-open .leaflet-control-zoom { margin-right: min(530px, calc(100vw - 50px)) !important; }
@media (max-width: 900px) {
  .table-panel { left: 18px; width: auto; top: auto; height: 42vh; bottom: 18px; }
  body.table-open .ui.top-right { right: 18px; }
}


body.table-open .bottom-left,
body.table-open .footnote,
body.table-open .vignette { display: none !important; }
body.table-only #map,
body.table-only .vignette,
body.table-only .top-left,
body.table-only .top-right,
body.table-only .bottom-left,
body.table-only .bottom-right,
body.table-only .leaflet-control-zoom { display: none !important; }
body.table-only .table-panel {
  display: flex !important;
  inset: 16px !important;
  width: auto !important;
  height: auto !important;
  top: 16px !important;
  right: 16px !important;
  bottom: 16px !important;
  left: 16px !important;
  max-width: none !important;
  border-radius: 16px;
}
body.table-only { background: #0b1210; }
.table-panel .icon-btn.active {
  background: rgba(230,195,106,0.18);
  border-color: var(--gold);
  color: var(--gold);
}
.table-panel td.addr { max-width: 180px; }


/* ---- Mobile layout ---- */
.mobile-bar {
  display: none;
  position: absolute; z-index: 1100; left: 12px; right: 12px; top: 12px;
  gap: 8px; pointer-events: none;
}
.mobile-bar > * { pointer-events: auto; }
.mobile-bar .mbtn {
  flex: 1;
  border: 1px solid var(--panel-border);
  background: var(--panel);
  color: var(--cream);
  backdrop-filter: blur(14px);
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 14px;
  font-family: inherit;
  box-shadow: var(--shadow);
  cursor: pointer;
}
.mobile-bar .mbtn.active {
  border-color: var(--gold);
  color: var(--gold);
}
@media (max-width: 820px) {
  .mobile-bar { display: flex; }
  .ui.top-left {
    top: 64px; left: 12px; right: 12px; max-width: none;
    display: none;
    max-height: calc(100vh - 88px);
    overflow: auto;
  }
  .ui.top-left.mobile-open { display: flex; z-index: 1200; }
  .ui.top-right { display: none; }
  body.filters-open .ui.top-right { display: none; }
  .ui.bottom-left { bottom: 12px; left: 12px; transform: scale(0.92); transform-origin: bottom left; }
  .ui.bottom-right { display: none; }
  .table-panel {
    left: 0 !important; right: 0 !important; top: auto !important;
    bottom: 0 !important; width: 100% !important; height: 48vh !important;
    border-radius: 18px 18px 0 0 !important; max-width: none !important;
  }
  .table-panel.open { display: flex; }
  body.table-open .bottom-left { display: none !important; }
  body.table-only .mobile-bar { display: none; }
  body.table-only .table-panel {
    inset: 0 !important; height: 100% !important; border-radius: 0 !important;
  }
  .filters { grid-template-columns: 1fr 1fr; }
  .chips { gap: 8px; }
  .chip { padding: 10px 12px; font-size: 13px; }
  .brand h1 { font-size: 22px; }
  .leaflet-control-zoom { margin-top: 64px !important; margin-right: 12px !important; }
  body.table-open .leaflet-control-zoom { margin-bottom: 50vh !important; }
  .table-panel .th { padding: 12px 14px; }
  .table-panel .th h2 { font-size: 18px; }
  .table-panel table { font-size: 13px; }
  .table-panel tbody td { padding: 12px 10px; }
}
@media (max-width: 820px) {
  body.filters-open .ui.top-left { display: flex; }
}


/* ---- Chrome hide (map-only) ---- */
.chrome-toggle {
  position: absolute; z-index: 1300;
  top: 18px; left: 50%; transform: translateX(-50%);
  border: 1px solid var(--panel-border);
  background: var(--panel);
  color: var(--cream);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-radius: 999px;
  padding: 10px 16px;
  font-size: 13px;
  font-family: inherit;
  box-shadow: var(--shadow);
  cursor: pointer;
  white-space: nowrap;
}
.chrome-toggle:hover { border-color: var(--gold); color: var(--gold); }
body.chrome-hidden .ui.top-left,
body.chrome-hidden .ui.bottom-left,
body.chrome-hidden .ui.bottom-right,
body.chrome-hidden .ui.top-right,
body.chrome-hidden #tablePanel,
body.chrome-hidden .mobile-bar,
body.chrome-hidden .vignette {
  display: none !important;
}
body.chrome-hidden .chrome-toggle {
  top: 14px;
}
@media (max-width: 820px) {
  .chrome-toggle { top: auto; bottom: 18px; left: auto; right: 12px; transform: none; width: auto; text-align: center; }
  body.chrome-hidden .chrome-toggle { bottom: 18px; left: auto; right: 12px; width: auto; writing-mode: horizontal-tb; }
  /* when mobile bar present, tuck hide next to it conceptually via bottom */
  body:not(.chrome-hidden) .chrome-toggle { bottom: 18px; top: auto; left: auto; right: 12px; width: auto; padding: 12px 14px; }
}


/* ---- Compact panel redesign ---- */
.top-left { top:12px; left:12px; max-width:min(360px, calc(100vw - 24px)); gap:0; }
.top-right { top:12px; right:12px; }
.bottom-left { bottom:16px; left:12px; }
.bottom-right { bottom:16px; right:12px; max-width:200px; }
.card { padding: 12px 14px; border-radius: 14px; }
.card.panel { display:flex; flex-direction:column; gap:10px; }
.brand-row { display:flex; flex-direction:column; gap:8px; }
.brand h1 { font-size:22px; }
.brand p { margin:4px 0 0; font-size:11px; }
.brand a { color: var(--gold); text-decoration:none; }
.brand a:hover { text-decoration:underline; }
.stat-row { display:flex; gap:10px; flex-wrap:wrap; padding-top:2px; border-top:1px solid rgba(246,241,228,0.08); }
.stat { min-width:48px; }
.stat b { font-size:15px; }
.stat span { font-size:9px; }
.filters {
  display:grid;
  grid-template-columns: 1.6fr 0.7fr 0.85fr 0.55fr;
  gap:6px;
}
.filters label { gap:3px; font-size:9px; }
.filters label.grow { grid-column: 1 / -1; }
.filters input, .filters select {
  padding: 7px 9px;
  font-size: 12px;
  border-radius: 8px;
}
.chips { display:flex; flex-wrap:wrap; gap:5px; }
.chip { padding: 5px 9px; font-size: 11px; }
.regions {
  border: 1px solid rgba(246,241,228,0.10);
  border-radius: 10px;
  padding: 0;
  background: rgba(255,255,255,0.02);
}
.regions > summary {
  list-style: none;
  cursor: pointer;
  padding: 7px 10px;
  font-size: 11px;
  color: var(--muted);
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  user-select:none;
}
.regions > summary::-webkit-details-marker { display:none; }
.regions > summary::after { content:"▸"; color:var(--gold); font-size:10px; }
.regions[open] > summary::after { content:"▾"; }
.regions .chips { padding: 0 8px 8px; }
.muted-hint { color: rgba(246,241,228,0.38); font-size:10px; }
.chip-hint { margin:0; font-size:10px; color:var(--muted); line-height:1.35; }
.legend { padding: 8px 10px; }
.legend .title { display:none; }
.legend-inline { display:flex; flex-wrap:wrap; gap:8px 10px; align-items:center; }
.legend-row { display:inline-flex; align-items:center; gap:5px; font-size:10px; color:var(--muted); }
.legend .dot { width:8px; height:8px; }
.footnote { font-size:10px; line-height:1.35; opacity:0.85; max-width:180px; }
.basemap { padding:3px; gap:4px; }
.basemap button { padding:6px 10px; font-size:11px; }
.chrome-toggle {
  top: 12px; left: auto; right: 12px; transform: none;
  padding: 8px 12px; font-size: 12px;
  /* sit under basemap on desktop */
  margin-top: 44px;
}
body.chrome-hidden .chrome-toggle { margin-top: 0; right: 12px; left: auto; transform: none; }
.table-panel { width: min(420px, calc(100vw - 24px)); }
.table-panel .th { padding: 10px 12px; }
.table-panel .th h2 { font-size: 16px; }
.table-panel table { font-size: 12px; }
.table-panel tbody td { padding: 8px 8px; }
@media (max-width: 820px) {
  .chrome-toggle { margin-top: 0; top: auto; bottom: 18px; left: auto; right: 12px; width: auto; }
  body:not(.chrome-hidden) .chrome-toggle { bottom: 18px; top: auto; left: auto; right: 12px; }
  .ui.top-left { top: 64px; left: 12px; right: 12px; max-width: none; }
  .filters { grid-template-columns: 1fr 1fr; }
  .filters label.grow { grid-column: 1 / -1; }
  .brand h1 { font-size: 20px; }
  .legend-inline { gap: 6px 8px; }
}


/* chrome-toggle mobile harden */
@media (max-width: 820px) {
  .chrome-toggle,
  body.chrome-hidden .chrome-toggle,
  body:not(.chrome-hidden) .chrome-toggle {
    position: absolute;
    top: auto !important;
    bottom: 16px !important;
    left: auto !important;
    right: 12px !important;
    transform: none !important;
    width: auto !important;
    max-width: 46vw;
    margin: 0 !important;
    padding: 10px 14px !important;
    white-space: nowrap;
    writing-mode: horizontal-tb !important;
    z-index: 1400;
  }
  body.table-open .chrome-toggle { bottom: calc(48vh + 12px) !important; }
  body.table-only .chrome-toggle { display: none !important; }
}
@media (min-width: 821px) {
  .chrome-toggle {
    top: 12px;
    right: 12px;
    left: auto;
    transform: none;
    margin-top: 44px; /* under basemap */
  }
  /* when table open, tuck hide control under basemap still — avoid overlapping Close */
  body.table-open .chrome-toggle { right: auto; left: 12px; margin-top: 0; top: auto; bottom: 16px; }
}

</style>
</head>
<body>
<div id="map"></div>
<button type="button" class="chrome-toggle" id="chromeToggle" title="Hide filters and table">Hide panels</button>

<div class="mobile-bar" id="mobileBar">
  <button type="button" class="mbtn" id="mobileFiltersBtn">Filters</button>
  <button type="button" class="mbtn" id="mobileTableBtn">Table</button>
</div>

<div class="vignette"></div>

<div class="ui top-left">
  <div class="card panel">
    <div class="brand-row">
      <div class="brand">
        <h1>American <span>Golf</span> Atlas</h1>
        <p><a href="history.html">Top 100 history</a></p>
      </div>
      <div class="stat-row" id="stats"></div>
    </div>
    <div class="filters">
      <label class="grow">Search<input id="q" type="search" placeholder="Pebble, Shinnecock…" autocomplete="off"/></label>
      <label>State<select id="state"><option value="">All</option></select></label>
      <label>Access<select id="access"><option value="">All</option></select></label>
      <label>Lists<select id="minLists">
        <option value="0">Any</option>
        <option value="1">≥1</option>
        <option value="2">≥2</option>
        <option value="3">≥3</option>
        <option value="4">≥4</option>

fetch('https://raw.githubusercontent.com/PublicaMundi/MappingAPI/master/data/geojson/us-states.json')
  .then(r => r.json())
  .then(geo => {
    stateBorders = L.geoJSON(geo, {
      style: {
        color: '#f6f1e4',
        weight: 1.25,
        opacity: 0.85,
        fill: false,
        fillOpacity: 0
      },
      interactive: false

    // If imagery is active, show borders
    if (current === layers.imagery || (current && current.hasLayer && layers.imagery && map.hasLayer(layers.imagery))) {
      try { stateBorders.addTo(map); } catch (e) {}
    }
    // Prefer checking active basemap button
    const active = document.querySelector('#basemap button.active');
    if (active && active.dataset.layer === 'imagery') {
      stateBorders.addTo(map);
    }
  })
  .catch(err => console.warn('State borders failed to load', err));

function syncStateBorders(layerKey) {
  if (!stateBorders) return;
  if (layerKey === 'imagery') {
    if (!map.hasLayer(stateBorders)) stateBorders.addTo(map);
  } else if (map.hasLayer(stateBorders)) {
    map.removeLayer(stateBorders);
  }
}

let current = layers.imagery.addTo(map);
syncStateBorders('imagery');

document.querySelectorAll('#basemap button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#basemap button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    map.removeLayer(current);
    current = layers[btn.dataset.layer].addTo(map);
    syncStateBorders(btn.dataset.layer);
  });
});

const cluster = L.markerClusterGroup({
  showCoverageOnHover: false,
  maxClusterRadius: 42,
  spiderfyOnMaxZoom: true,
  disableClusteringAtZoom: 10
});
map.addLayer(cluster);

const stateSel = document.getElementById('state');
const accessSel = document.getElementById('access');
[...new Set(COURSES.map(c => c.code))].sort().forEach(s => {
  const o=document.createElement('option'); o.value=s; o.textContent=s; stateSel.appendChild(o);
});
['Public','Private','Resort','Semi-Private','Unknown'].forEach(s => {
  const o=document.createElement('option'); o.value=s; o.textContent=s; accessSel.appendChild(o);
});
function accessMatches(raw, filter) {
  if (!filter) return true;
  const s = String(raw || '').toLowerCase();
  if (filter === 'Unknown') return !s || s === 'unknown';
  if (filter === 'Semi-Private') return s.includes('semi');
  if (filter === 'Public') return /public|municipal/.test(s);
  if (filter === 'Private') return s.includes('private') || s.includes('military');
  if (filter === 'Resort') return s.includes('resort');
  return s === filter.toLowerCase();
}

let requiredLists = new Set();
let top100Only = true;
let regionalFilters = []; // [{code, depth}, ...] OR across active regional chips
const top100Btn = document.querySelector('#listChips .chip[data-filter="top100"]');
function clearRegional() {
  document.querySelectorAll('#regionalChips .chip').forEach(b => b.classList.remove('active'));
  regionalFilters = [];
}
function syncRegional() {
  regionalFilters = [...document.querySelectorAll('#regionalChips .chip.active')].map(b => ({
    code: b.dataset.regional, depth: Number(b.dataset.depth)
  }));
}
document.querySelectorAll('#listChips .chip').forEach(btn => {
  btn.addEventListener('click', () => {
    // Single-select: only one top list active at a time
    if (btn.dataset.filter === 'top100') {
      const turnOn = !btn.classList.contains('active');
      document.querySelectorAll('#listChips .chip').forEach(b => b.classList.remove('active'));
      clearRegional();
      if (turnOn) {
        btn.classList.add('active');
        top100Only = true;
        requiredLists = new Set();
      } else {
        top100Only = false;
        requiredLists = new Set();
      }
    } else {
      const turnOn = !btn.classList.contains('active');
      document.querySelectorAll('#listChips .chip').forEach(b => b.classList.remove('active'));
      clearRegional();
      top100Only = false;
      if (turnOn) {
        btn.classList.add('active');
        requiredLists = new Set([btn.dataset.list]);
      } else {
        requiredLists = new Set();
      }
    }
    render();
  });
});
document.querySelectorAll('#regionalChips .chip').forEach(btn => {
  btn.addEventListener('click', () => {
    // Single-select regions too; clears national list chips
    const turnOn = !btn.classList.contains('active');
    document.querySelectorAll('#regionalChips .chip').forEach(b => b.classList.remove('active'));
    if (top100Btn) top100Btn.classList.remove('active');
    document.querySelectorAll('#listChips .chip[data-list]').forEach(b => b.classList.remove('active'));
    top100Only = false;
    requiredLists = new Set();
    if (turnOn) btn.classList.add('active');
    syncRegional();
    render();
  });
});

function popupHtml(c) {
  const top = [];
  if (c.gd100 != null) top.push(`<span class="badge gold">GD100 #${c.gd100}</span>`);
  if (c.golf100 != null) top.push(`<span class="badge gold">GOLF100 #${c.golf100}</span>`);
  if (c.gdbis != null) top.push(`<span class="badge">Best-in-State #${c.gdbis}</span>`);
  (c.list_ids||[]).filter(id => !['GD100','GOLF100'].includes(id)).forEach(id => {
    top.push(`<span class="badge">${id}</span>`);
  });
  const loc = [c.address, c.city, c.code].filter(Boolean).join(', ') || c.code;
  const bits = [c.access, c.par?`par ${c.par}`:null, c.architect||null].filter(Boolean).join(' · ');
  const links = [
    c.website ? `<a href="${c.website}" target="_blank" rel="noopener">Website</a>` : null,
    c.t100 ? `<a href="${c.t100}" target="_blank" rel="noopener">Ranking page</a>` : null,
  ].filter(Boolean).join('');
  return `<div class="popup">
    <div class="kicker">${c.top100_usa ? '★ National Top 100 · ' : ''}State rank #${c.rank}</div>
    <h3>${c.name}</h3>
    <div class="meta">${loc}</div>
    <div class="meta" style="margin-top:4px">${bits}</div>
    <div class="badges">${top.join('') || '<span class="badge">State list only</span>'}</div>
    ${links ? `<div class="links">${links}</div>` : ''}
  </div>`;
}

function makeDot(color) {
  return L.divIcon({
    className: '',
    html: `<div style="width:12px;height:12px;border-radius:50%;background:${color};border:2px solid rgba(255,255,255,.95);box-shadow:0 1px 6px rgba(0,0,0,.55)"></div>`,
    iconSize: [12,12], iconAnchor: [6,6]
  });
}
function makeStar() {
  return L.divIcon({
    className: '',
    html: `<div style="width:28px;height:28px;display:grid;place-items:center;transform:translate(-4px,-4px)">
      <div style="font-size:22px;line-height:1;color:#e6c36a;filter:drop-shadow(0 0 4px rgba(0,0,0,.85)) drop-shadow(0 0 1px #000)">★</div>
    </div>`,
    iconSize: [28,28], iconAnchor: [14,14]
  });
}


let lastTableRows = [];
let lastTableTitle = '';

function activeListTitle() {
  const label = (b) => (b.title && b.title.trim()) || b.textContent.trim();
  if (regionalFilters.length === 1) {
    const btn = document.querySelector(`#regionalChips .chip.regional.active[data-regional="${regionalFilters[0].code}"]`);
    return btn ? label(btn) : `${regionalFilters[0].code} Top ${regionalFilters[0].depth}`;
  }
  if (regionalFilters.length > 1) {
    return regionalFilters.map(r => {
      const btn = document.querySelector(`#regionalChips .chip.regional.active[data-regional="${r.code}"]`);
      return btn ? label(btn) : `${r.code}≤${r.depth}`;
    }).join(' + ');
  }
  const listBtns = [...document.querySelectorAll('#listChips .chip[data-list].active')];
  if (listBtns.length === 1 && listBtns[0].dataset.list === 'GDBIS') return 'Best in State — #1 per state';
  if (listBtns.length) return listBtns.map(label).join(' + ');
  if (top100Only) return '★ Top 100 USA';
  return 'Filtered courses';
}

function showTablePanel(show) {
  const panel = document.getElementById('tablePanel');
  if (!panel) return;
  panel.classList.toggle('open', !!show);
  panel.setAttribute('aria-hidden', show ? 'false' : 'true');
  document.body.classList.toggle('table-open', !!show);
  setTimeout(() => map.invalidateSize(), 180);
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

function listPills(c) {
  const bits = [];
  if (c.gd100 != null) bits.push(`<span class="pill gold">GD${c.gd100}</span>`);
  if (c.golf100 != null) bits.push(`<span class="pill gold">GOLF${c.golf100}</span>`);
  if (c.gdbis != null) bits.push(`<span class="pill">BIS${c.gdbis}</span>`);
  (c.list_ids || []).forEach(id => {
    if (['GD100','GOLF100','GDBIS'].includes(id)) return;
    bits.push(`<span class="pill">${escapeHtml(id)}</span>`);
  });
  return bits.join('') || '<span class="muted">—</span>';
}

function sortForTable(rows) {
  const copy = rows.slice();
  if (regionalFilters.length) {
    copy.sort((a,b) => (a.code||'').localeCompare(b.code||'') || Number(a.rank) - Number(b.rank));
    return copy;
  }
  if (requiredLists.has('GD100') && requiredLists.size === 1) {
    copy.sort((a,b) => (a.gd100??999) - (b.gd100??999));
    return copy;
  }
  if (requiredLists.has('GOLF100') && requiredLists.size === 1) {
    copy.sort((a,b) => (a.golf100??999) - (b.golf100??999));
    return copy;
  }
  if (top100Only && requiredLists.size === 0) {
    copy.sort((a,b) => (a.gd100??a.golf100??999) - (b.gd100??b.golf100??999) || Number(a.rank)-Number(b.rank));
    return copy;
  }
  if (requiredLists.has('GDBIS') && requiredLists.size === 1) {
    copy.sort((a,b) => (a.state||'').localeCompare(b.state||'') || (a.code||'').localeCompare(b.code||''));
    return copy;
  }
  copy.sort((a,b) => (a.code||'').localeCompare(b.code||'') || Number(a.rank) - Number(b.rank));
  return copy;
}

function displayRank(c) {
  if (regionalFilters.length) return c.rank;
  if (requiredLists.has('GD100') && requiredLists.size === 1) return c.gd100 ?? c.rank;
  if (requiredLists.has('GOLF100') && requiredLists.size === 1) return c.golf100 ?? c.rank;
  if (requiredLists.has('GDBIS') && requiredLists.size === 1) return c.code || (c.gdbis ?? c.rank);
  if (top100Only && requiredLists.size === 0) return c.gd100 ?? c.golf100 ?? c.rank;
  return c.rank;
}

function renderTable(filtered) {
  const title = activeListTitle();
  lastTableTitle = title;
  const rows = sortForTable(filtered);
  lastTableRows = rows;
  const shouldShow = top100Only || requiredLists.size > 0 || regionalFilters.length > 0;
  showTablePanel(shouldShow);
  if (!shouldShow) return;
  document.getElementById('tableTitle').textContent = title;
  document.getElementById('tableSub').textContent = `${rows.length} courses · click a row to fly on the map`;
  const body = document.getElementById('tableBody');
  body.innerHTML = rows.map((c, idx) => {
      const rankLabel = escapeHtml(displayRank(c));
    const courseInner = `${c.top100_usa ? '★ ' : ''}<span class="muted">#${rankLabel}</span> ${escapeHtml(c.name)}`;
    const courseCell = c.website
      ? `<a href="${escapeHtml(c.website)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${courseInner}</a>`
      : `<div class="name">${courseInner}</div>`;
    return `<tr data-idx="${idx}">
      <td>${courseCell}</td>
      <td class="muted">${escapeHtml(c.city || '')}</td>
      <td class="muted">${escapeHtml(c.state || c.code || '')}</td>
      <td class="muted">${escapeHtml(c.access || '')}</td>
      <td>${listPills(c)}</td>
    </tr>`;
  }).join('');
  body.querySelectorAll('tr').forEach(tr => {
    tr.addEventListener('click', () => {
      const c = lastTableRows[Number(tr.dataset.idx)];
      if (!c || c.lat == null || c.lon == null) return;
      map.setView([c.lat, c.lon], Math.max(map.getZoom(), 12), { animate: true });
      // open a popup at the course
      L.popup({ maxWidth: 340 })
        .setLatLng([c.lat, c.lon])
        .setContent(popupHtml(c))
        .openOn(map);
    });
  });
}

function downloadTableCsv() {
  if (!lastTableRows.length) return;
  const headers = ['rank','course_name','state','state_code','city','access','website','architect','address','list_ids','gd100','golf100','gdbis','lat','lon'];
  const lines = [headers.join(',')];
  for (const c of lastTableRows) {
    const row = [
      displayRank(c), c.name, c.state, c.code, c.city, c.access, c.website, c.architect, c.address,
      (c.list_ids||[]).join('|'), c.gd100??'', c.golf100??'', c.gdbis??'', c.lat??'', c.lon??''
    ].map(v => {
      const s = String(v??'');
      return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
    });
    lines.push(row.join(','));
  }
  const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (lastTableTitle || 'courses').toLowerCase().replace(/[^a-z0-9]+/g,'_') + '.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

function setTableOnly(on) {
  document.body.classList.toggle('table-only', !!on);
  const btn = document.getElementById('tableOnlyBtn');
  if (btn) {
    btn.classList.toggle('active', !!on);
    btn.textContent = on ? 'Show map' : 'Table only';
  }
  setTimeout(() => { try { map.invalidateSize(); } catch (e) {} }, 200);
}
document.getElementById('tableClose')?.addEventListener('click', () => {
  setTableOnly(false);
  showTablePanel(false);
});
document.getElementById('tableCsv')?.addEventListener('click', downloadTableCsv);
document.getElementById('tableOnlyBtn')?.addEventListener('click', () => {
  const next = !document.body.classList.contains('table-only');
  if (next) showTablePanel(true);
  setTableOnly(next);
});

function render() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const st = stateSel.value;
  const ac = accessSel.value;
  const minLists = Number(document.getElementById('minLists').value);
  cluster.clearLayers();
  let shown = 0, stars = 0;
  const filtered = [];
  for (const c of COURSES) {
    if (st && c.code !== st) continue;
    if (ac && !accessMatches(c.access, ac)) continue;
    if ((c.list_count||0) < minLists) continue;
    // Regional chips (OR): state_code + rank<=depth
    if (regionalFilters.length) {
      const ok = regionalFilters.some(rf => c.code === rf.code && Number(c.rank) <= rf.depth);
      if (!ok) continue;
    }
    // Top 100 exclusive mode (only when that chip is active and no list/regional chips)
    if (top100Only && requiredLists.size === 0 && regionalFilters.length === 0 && !c.top100_usa) continue;
    // List chips use OR: course must appear on any selected list
    // Special case: GDBIS alone (Best in State) => only #1 in each state
    if (requiredLists.size === 1 && requiredLists.has('GDBIS')) {
      if (Number(c.gdbis) !== 1) continue;
    } else if (requiredLists.size && !(c.list_ids||[]).some(id => requiredLists.has(id))) {
      continue;
    }
    if (q) {
      const hay = `${c.name} ${c.city} ${c.architect} ${c.state} ${c.address}`.toLowerCase();
      if (!hay.includes(q)) continue;
    }
    filtered.push(c);
  }
  filtered.sort((a,b) => Number(a.top100_usa) - Number(b.top100_usa));
  for (const c of filtered) {
    const m = L.marker([c.lat, c.lon], {
      icon: c.top100_usa ? makeStar() : makeDot(colorFor(c.list_count||0)),
      zIndexOffset: c.top100_usa ? 1000 : 0
    });
    m.bindPopup(popupHtml(c), { maxWidth: 340 });
    cluster.addLayer(m);
    shown++;
    if (c.top100_usa) stars++;
  }
  // Contextual stats — avoid "124 Shown / 124 Top 100" when ★ filter is on
  const statesShown = new Set(filtered.map(c => c.code || c.state).filter(Boolean)).size;
  let secondStat;
  if (top100Only && requiredLists.size === 0 && regionalFilters.length === 0) {
    secondStat = `<div class="stat"><b>${statesShown.toLocaleString()}</b><span>States</span></div>`;
  } else if (regionalFilters.length) {
    secondStat = `<div class="stat"><b>${stars.toLocaleString()}</b><span>Also ★100</span></div>`;
  } else if (requiredLists.size) {
    secondStat = `<div class="stat"><b>${stars.toLocaleString()}</b><span>Also ★100</span></div>`;
  } else {
    secondStat = `<div class="stat"><b>${TOP100_N.toLocaleString()}</b><span>Top 100</span></div>`;
  }
  document.getElementById('stats').innerHTML = `
    <div class="stat"><b>${shown.toLocaleString()}</b><span>Shown</span></div>
    ${secondStat}
    <div class="stat"><b>${COURSES.length.toLocaleString()}</b><span>Mapped</span></div>
    <div class="stat"><b>${TOTAL.toLocaleString()}</b><span>In DB</span></div>`;
  document.getElementById('note').textContent =
    `★ = GD100 and/or GOLF100 (${TOP100_N} with coords). ${UNMAPPED} courses lack lat/lon. Free sources only — .`;
  if (regionalFilters.length === 1 && filtered.length) {
    try {
      const b = L.latLngBounds(filtered.map(c => [c.lat, c.lon]));
      if (b.isValid()) map.fitBounds(b.pad(0.12));
    } catch (e) {}
  }
  renderTable(filtered);

}
['q','state','access','minLists'].forEach(id => document.getElementById(id).addEventListener('input', render));



// Keep Regions open when a regional filter is active
(function setupRegionsAutoOpen() {
  const details = document.getElementById('regionsDetails');
  if (!details) return;
  const sync = () => {
    const on = !!document.querySelector('#regionalChips .chip.active');
    if (on) details.open = true;
  };
  document.getElementById('regionalChips')?.addEventListener('click', () => setTimeout(sync, 0));
  sync();
})();

// Hide all filter/table chrome for a clean map
(function setupChromeToggle() {
  const btn = document.getElementById('chromeToggle');
  if (!btn) return;
  const sync = () => {
    const hidden = document.body.classList.contains('chrome-hidden');
    btn.textContent = hidden ? 'Show panels' : 'Hide panels';
    btn.title = hidden ? 'Show filters and table' : 'Hide filters and table';
    btn.setAttribute('aria-pressed', hidden ? 'true' : 'false');
  };
  let chromeRestore = { table: false, tableOnly: false };
  btn.addEventListener('click', () => {
    const willHide = !document.body.classList.contains('chrome-hidden');
    if (willHide) {
      const panel = document.getElementById('tablePanel');
      chromeRestore = {
        table: !!(panel && panel.classList.contains('open')) || document.body.classList.contains('table-open'),
        tableOnly: document.body.classList.contains('table-only'),
      };
      try { setTableOnly(false); } catch (e) {}
      try { showTablePanel(false); } catch (e) {}
      document.body.classList.remove('filters-open', 'table-open', 'table-only');
      const topLeft = document.querySelector('.ui.top-left');
      if (topLeft) topLeft.classList.remove('mobile-open');
      const filtersBtn = document.getElementById('mobileFiltersBtn');
      if (filtersBtn) { filtersBtn.classList.remove('active'); filtersBtn.textContent = 'Filters'; }
      const tableBtn = document.getElementById('mobileTableBtn');
      if (tableBtn) { tableBtn.classList.remove('active'); tableBtn.textContent = 'Table'; }
    } else {
      // restore ranked table if it was open before hide
      if (chromeRestore.table) {
        try { showTablePanel(true); } catch (e) {}
      }
      if (chromeRestore.tableOnly) {
        try { setTableOnly(true); } catch (e) {}
      }
      const tableBtn = document.getElementById('mobileTableBtn');
      if (tableBtn) {
        const on = chromeRestore.table || chromeRestore.tableOnly;
        tableBtn.classList.toggle('active', on);
        tableBtn.textContent = on ? 'Map' : 'Table';
      }
    }
    document.body.classList.toggle('chrome-hidden', willHide);
    sync();
    try { map.invalidateSize(); } catch (e) {}
  });
  // keyboard: H toggles when not typing in an input
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'h' && e.key !== 'H') return;
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    btn.click();
  });
  sync();
})();

// Mobile chrome
(function setupMobileChrome() {
  const filtersBtn = document.getElementById('mobileFiltersBtn');
  const tableBtn = document.getElementById('mobileTableBtn');
  const topLeft = document.querySelector('.ui.top-left');
  if (!filtersBtn || !tableBtn || !topLeft) return;

  filtersBtn.addEventListener('click', () => {
    const open = document.body.classList.toggle('filters-open');
    topLeft.classList.toggle('mobile-open', open);
    filtersBtn.classList.toggle('active', open);
    filtersBtn.textContent = open ? 'Close' : 'Filters';
  });

  tableBtn.addEventListener('click', () => {
    const panel = document.getElementById('tablePanel');
    const open = !(panel && panel.classList.contains('open')) && !document.body.classList.contains('table-only');
    if (open) {
      // ensure some list context: if none, use Top 100
      if (!top100Only && requiredLists.size === 0 && regionalFilters.length === 0) {
        const star = document.querySelector('#listChips .chip[data-filter="top100"]');
        if (star && !star.classList.contains('active')) star.click();
      }
      showTablePanel(true);
      setTableOnly(true);
      // close filters drawer when table takes over
      document.body.classList.remove('filters-open');
      topLeft.classList.remove('mobile-open');
      filtersBtn.classList.remove('active');
      filtersBtn.textContent = 'Filters';
    } else {
      setTableOnly(false);
      showTablePanel(false);
    }
    const now = document.body.classList.contains('table-only') || (panel && panel.classList.contains('open'));
    tableBtn.classList.toggle('active', now);
    tableBtn.textContent = now ? 'Map' : 'Table';
  });

  // When closing table-only via Show map button, sync mobile Table button
  const onlyBtn = document.getElementById('tableOnlyBtn');
  if (onlyBtn) {
    onlyBtn.addEventListener('click', () => {
      setTimeout(() => {
        const on = document.body.classList.contains('table-only');
        tableBtn.classList.toggle('active', on);
        tableBtn.textContent = on ? 'Map' : 'Table';
      }, 0);
    });
  }
})();

render();
</script>
